# ── Internal state ─────────────────────────────────────────────────────────────

# Each widget gets a unique ID so the DOM element can be found later.
# We use a list-wrapped integer so the inner functions can mutate it (Python 3
# closures cannot rebind a plain integer from an enclosing scope).
_counter = [0]

def _uid():
    """Return a globally unique HTML element ID string."""
    _counter[0] += 1
    return f"et_{_counter[0]}"


def _current_output():
    """
    Return the DOM element that is currently receiving output.

    The JavaScript cell runner sets window.examCurrentOutputId to the ID of
    the active cell's output <div> before executing each cell. exam_tools reads
    this value whenever it needs to append content to the page.
    """
    if not _IN_PYODIDE:
        return None
    eid = window.examCurrentOutputId
    if not eid:
        raise RuntimeError(
            "exam_tools: no output context — are you running inside the exam tool?"
        )
    return document.getElementById(eid)


def _append(html: str):
    """Append an HTML string to the current cell's output area."""
    el = _current_output()
    if el:
        el.insertAdjacentHTML("beforeend", html)


def _append_to(element_id: str, html: str):
    """Append an HTML string to a specific element by ID."""
    el = document.getElementById(element_id)
    if el:
        el.insertAdjacentHTML("beforeend", html)


# ── Widget base class ──────────────────────────────────────────────────────────

class _Widget:
    """
    Base class for all widgets. Stores the DOM element ID so .value can be
    read from the live page element at any time.
    """
    def __init__(self, element_id: str):
        self._id = element_id

    def _element(self):
        """Return the underlying DOM element."""
        return document.getElementById(self._id)

class TextInput(_Widget):

        """The current text the student has typed."""
        el = self._element()
        return el.value if el else ""

    def clear(self):
        """Empty the field — useful after a successful form submission."""
        el = self._element()
        if el:
            el.value = ""


class NumberInput(_Widget):
    """A numeric input field that returns a float."""

    @property
    def value(self) -> float:
        el = self._element()
        v = el.value if el else ""
        try:
            return float(v)
        except (ValueError, TypeError):
            return 0.0


class Dropdown(_Widget):
    """A dropdown (select) widget."""

    @property
    def value(self):
        """The currently selected option value."""
        el = self._element()
        return el.value if el else ""


class Slider(_Widget):
    """A range slider that returns a float."""

    @property
    def value(self) -> float:
        el = self._element()
        try:
            return float(el.value) if el else 0.0
        except (ValueError, TypeError):
            return 0.0


# ── Widget factory functions ───────────────────────────────────────────────────
# These are the functions students actually call. Each one injects HTML into the
# page and returns a widget object whose .value can be read later.

def text_input(label: str, placeholder: str = "") -> TextInput:
    """
    Create a labelled text input field.

    Args:
        label:       Text shown above the input.
        placeholder: Grey hint text shown inside the empty input.

    Returns:
        TextInput — read .value to get the current contents.

    Example:
        name = text_input("Student name:", placeholder="e.g. Agnes Nitt")
        # later:
        print(name.value)
    """
    wid = _uid()
    _append(f"""
        <div class="et-widget">
            <label class="et-label" for="{wid}">{label}</label>
            <input type="text" id="{wid}" class="et-input"
                   placeholder="{placeholder}" autocomplete="off">
        </div>
    """)
    return TextInput(wid)


def number_input(label: str, min_val: float = 0, max_val: float = 100,
                 default: float = 0) -> NumberInput:
    """
    Create a labelled numeric input field.

    Args:
        label:   Text shown above the input.
        min_val: Minimum allowed value.
        max_val: Maximum allowed value.
        default: Starting value.

    Returns:
        NumberInput — read .value to get the current number.

    Example:
        age = number_input("Age:", min_val=16, max_val=120, default=20)
    """
    wid = _uid()
    _append(f"""
        <div class="et-widget">
            <label class="et-label" for="{wid}">{label}</label>
            <input type="number" id="{wid}" class="et-input"
                   min="{min_val}" max="{max_val}" value="{default}">
        </div>
    """)
    return NumberInput(wid)


def dropdown(label: str, options: list) -> Dropdown:
    """
    Create a labelled dropdown (select) menu.

    Args:
        label:   Text shown above the dropdown.
        options: A list of strings, or a list of (display_text, value) tuples.
                 Use tuples when the displayed text should differ from the value
                 stored — for example, showing a programme name but storing its ID.

    Returns:
        Dropdown — read .value to get the selected option.

    Examples:
        # Simple list of strings:
        gender = dropdown("Gender:", options=["F", "M", "Other"])

        # Tuples of (display, value) — useful for database IDs:
        prog = dropdown("Programme:", options=[
            ("Magical Arts", 1),
            ("Natural Philosophy", 2),
        ])
        # prog.value will be "1" or "2" (always a string from the DOM)
    """
    wid = _uid()
    opts_html = ""
    for opt in options:
        if isinstance(opt, (list, tuple)) and len(opt) == 2:
            display, val = opt
            opts_html += f'<option value="{val}">{display}</option>'
        else:
            opts_html += f'<option value="{opt}">{opt}</option>'

    _append(f"""
        <div class="et-widget">
            <label class="et-label" for="{wid}">{label}</label>
            <select id="{wid}" class="et-select">{opts_html}</select>
        </div>
    """)
    return Dropdown(wid)


def slider(label: str, min_val: float = 0, max_val: float = 100,
           default: float = 50, step: float = 1) -> Slider:
    """
    Create a labelled range slider.

    Args:
        label:   Text shown above the slider. The current value is shown inline.
        min_val: Left-most value.
        max_val: Right-most value.
        default: Starting position.
        step:    How much the value changes per tick.

    Returns:
        Slider — read .value to get the current number.

    Example:
        credits = slider("Credits:", min_val=5, max_val=30, default=15, step=5)
    """
    wid     = _uid()
    disp_id = _uid()   # ID for the live numeric display next to the label
    _append(f"""
        <div class="et-widget">
            <label class="et-label">
                {label} <span id="{disp_id}" class="et-slider-value">{default}</span>
            </label>
            <input type="range" id="{wid}" class="et-slider"
                   min="{min_val}" max="{max_val}" value="{default}" step="{step}"
                   oninput="document.getElementById('{disp_id}').textContent=this.value">
        </div>
    """)
    return Slider(wid)


def button(label: str):
    """
    Decorator that creates a button. The decorated function runs when clicked.

    Unlike ipywidgets, no 'b' parameter is needed in the function definition.
    Output from show() inside the function appears in a dedicated area beneath
    the button, which is cleared and redrawn on each click.

    Example:
        name = text_input("Name:")

        @button("Submit")
        def submit():
            show(f"Hello, {name.value}")

    The @button line must come immediately before the def line.
    """
    def decorator(fn):
        btn_id  = _uid()   # ID for the <button> element
        out_id  = _uid()   # ID for the output <div> beneath the button

        # Inject the button and its output container into the current cell area
        _append(f"""
            <button id="{btn_id}" class="et-button">{label}</button>
            <div id="{out_id}" class="et-btn-output"></div>
        """)

        # Capture the current output context so the click handler can restore it
        # (the click may happen long after this cell has finished running)
        captured_out_id = out_id

        def _handle_click(event):
            """Called by JavaScript when the button is clicked."""
            # Save whatever the current output context is
            prev_context = window.examCurrentOutputId

            # Clear previous button output
            out_el = document.getElementById(captured_out_id)
            if out_el:
                out_el.innerHTML = ""

            # Point show() / _append() at the button's output div
            window.examCurrentOutputId = captured_out_id

            try:
                fn()
            except Exception:
                # Show the full traceback so the student can debug
                tb = traceback.format_exc()
                _append(f'<pre class="et-error">{tb}</pre>')
            finally:
                # Always restore the previous context
                window.examCurrentOutputId = prev_context

        # create_proxy wraps the Python function so JavaScript can call it
        proxy = create_proxy(_handle_click)
        document.getElementById(btn_id).addEventListener("click", proxy)

        return fn   # return the original function unchanged

    return decorator


# ── Output functions ───────────────────────────────────────────────────────────

def show(obj):
    """
    Display any Python object in the current output area.

    Handles:
        str, int, float, bool  → plain text
        pandas DataFrame       → formatted HTML table
        matplotlib Figure      → inline PNG image
        list, dict             → plain text via str()

    This replaces both print() and display() from the Jupyter environment.
    You can call show() multiple times in one cell or button handler.

    Example:
        show("Query complete.")
        show(my_dataframe)
        show(my_figure)
    """
    import pandas as pd

    # We import matplotlib lazily so cells that do not use it load faster
    try:
        import matplotlib.figure as mpl_fig
        _has_mpl = True
    except ImportError:
        _has_mpl = False

    if isinstance(obj, pd.DataFrame):
        # Convert DataFrame to an HTML table. index=False keeps it clean.
        html = obj.to_html(classes="et-table", border=0, index=False)
        _append(f'<div class="et-table-wrap">{html}</div>')

    elif _has_mpl and isinstance(obj, mpl_fig.Figure):
        # Render matplotlib figure to a base64-encoded PNG and show it inline
        import matplotlib.pyplot as plt
        buf = io.BytesIO()
        obj.savefig(buf, format="png", bbox_inches="tight", dpi=100)
        buf.seek(0)
        b64 = base64.b64encode(buf.read()).decode("ascii")
        buf.close()
        plt.close(obj)   # free memory — important in a long exam session
        _append(f'<img src="data:image/png;base64,{b64}" class="et-plot" alt="chart">')

    elif isinstance(obj, str):
        # Preserve newlines in string output
        safe = obj.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
        _append(f'<pre class="et-text">{safe}</pre>')

    else:
        # Fallback: convert to string representation
        safe = str(obj).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")
        _append(f'<pre class="et-text">{safe}</pre>')


def show_table(rows, columns=None):
    """
    Display raw sqlite3 query results as a formatted table.

    This is a convenience wrapper for when you use cursor.fetchall() directly
    rather than pd.read_sql(). If you are already using pd.read_sql(), just
    call show() on the resulting DataFrame instead.

    Args:
        rows:    The list of tuples returned by cursor.fetchall().
        columns: Optional list of column name strings. If omitted, columns are
                 labelled 0, 1, 2, ...

    Example:
        cursor.execute("SELECT name, gender FROM students WHERE program_id = 1")
        show_table(cursor.fetchall(), columns=["Name", "Gender"])
    """
    import pandas as pd

    if rows is None or len(rows) == 0:
        _append('<p class="et-empty">No results returned.</p>')
        return

    if isinstance(rows, pd.DataFrame):
        show(rows)
        return

    df = pd.DataFrame(rows, columns=columns)
    show(df)

    await initPyodide();
    showNameScreen();
  } catch(e) {
    document.getElementById("load-msg").textContent =
      "Failed to load Python: " + e.message + " — check internet and refresh.";
  }
};

async function initPyodide() {
  // Step 1: Load the Python runtime itself
  setMsg("Loading Python runtime (step 1 of 3)...");
  pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.4/full/"
  });

  // Step 2: Install all packages via micropip
  // The Pyodide docs recommend micropip.install() for everything — it handles
  // both compiled Pyodide packages (numpy, pandas, matplotlib) and pure Python
  // packages (openpyxl) using the same call. We load micropip itself first
  // via loadPackage(), then hand off to it for everything else.
  setMsg("Installing packages via micropip (step 2 of 3)...");
  // sqlite3 is a special case — it must use loadPackage, not micropip.
  // (Pyodide unvendors sqlite3 from the stdlib; the error message says so explicitly.)
  await pyodide.loadPackage(["micropip", "sqlite3"]);

  // All other packages go through micropip, which handles both
  // Pyodide-compiled wheels and pure-Python packages like openpyxl.
  await pyodide.runPythonAsync(`
import micropip
await micropip.install(["numpy", "pandas", "matplotlib", "openpyxl"])
`);

  // Step 3: Set up the exam environment
  setMsg("Setting up exam environment (step 3 of 3)...");

  // Write exam_tools.py into Pyodide's virtual filesystem
  pyodide.FS.writeFile("/exam_tools.py", EXAM_TOOLS_CODE);

  // Decode the embedded SQLite database into the virtual filesystem
  const dbBytes = b64ToBytes(DB_B64);
  try { pyodide.FS.mkdir("/exam_data"); } catch(e) {}
  pyodide.FS.writeFile("/exam_data/unseen_university.db", dbBytes);

  // Fetch Excel files from the same folder as this HTML file
  for (const fname of ["late_enrolments.xlsx", "staff_survey.xlsx"]) {
    try {
      const r = await fetch(fname);
      if (r.ok) pyodide.FS.writeFile("/exam_data/"+fname, new Uint8Array(await r.arrayBuffer()));
    } catch(e) { console.warn("Could not pre-load " + fname); }
  }

  // Set working directory and import path so student code finds all files
  await pyodide.runPythonAsync(`
import sys, os
sys.path.insert(0, '/')
os.chdir('/exam_data')
import sys, io
_exam_original_stdout = sys.stdout
import matplotlib
matplotlib.use('Agg')
import sqlite3  # confirm sqlite3 is available before the exam starts
`);
}

function setMsg(t){ document.getElementById("load-msg").textContent = t; }

// ── Name screen ────────────────────────────────────────────────────────────
function showNameScreen() {
  meta = parseFrontmatter(EXAM_MARKDOWN);
  document.getElementById("card-title").textContent = meta.title || "Examination";
  document.getElementById("card-meta").textContent  =
    [meta.module, meta.session].filter(Boolean).join(" — ");
  document.getElementById("loading").style.display     = "none";
  document.getElementById("name-screen").style.display = "flex";
  document.getElementById("sname").addEventListener("keydown", e => {
    if (e.key === "Enter") beginExam();
  });
}

async function beginExam() {
  const name = document.getElementById("sname").value.trim();
  if (!name) { alert("Please enter your full name."); return; }
  if ("showSaveFilePicker" in window) {
    const safe = name.replace(/[^a-z0-9]/gi,"_").toLowerCase();
    const date = new Date().toISOString().slice(0,10);
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: `exam_${safe}_${date}.json`,
        types: [{description:"Exam JSON",accept:{"application/json":[".json"]}}]
      });
    } catch(e){ fileHandle=null; }
  }
  document.getElementById("name-screen").style.display = "none";
  document.getElementById("app").style.display         = "flex";
  document.getElementById("h-title").textContent       =
    [meta.title, meta.module].filter(Boolean).join(" — ");
  document.getElementById("h-student").textContent = name;
  cells = parseExam(EXAM_MARKDOWN);
  buildFilePanel();
  renderExam();
  await runSetupCells();
}

// ── File panel ─────────────────────────────────────────────────────────────
function buildFilePanel() {
  const list = document.getElementById("fp-list");
  list.innerHTML = "";
  FILES_META.forEach(f => {
    const div = document.createElement("div");
    div.className = "fp-file";
    // Each file gets one row: icon, name+desc, and a single Copy Filename button.
    // Clicking the button copies the bare filename (e.g. "late_enrolments.xlsx")
    // so the student can paste it directly into their code.
    div.innerHTML = `
      <div style="flex:1">
        <div class="fp-filename">${f.name}</div>
        <div class="fp-filedesc">${f.desc}</div>
      </div>
      <button class="fp-copy-btn" onclick="copyFilename(this,'${f.name}')">Copy filename</button>`;
    list.appendChild(div);
  });
}

function copyFilename(btn, filename) {
  navigator.clipboard.writeText(filename).then(() => {
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    showToast(filename + " copied");
    setTimeout(() => { btn.textContent="Copy filename"; btn.classList.remove("copied"); }, 1500);
  }).catch(() => {
    // Clipboard API can be blocked on file:// in some browsers.
    // Fall back to a prompt so the student can copy manually.
    window.prompt("Copy this filename:", filename);
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

// ── Markdown parsing ───────────────────────────────────────────────────────
function parseFrontmatter(text) {
  const m = text.match(/^---\n([\s\S]*?)\n---\n/);
  if (!m) return {};
  const o = {};
  m[1].split("\n").forEach(line => {
    const [k,...v] = line.split(":");
    if (k && v.length) o[k.trim()] = v.join(":").trim();
  });
  return o;
}

function parseExam(text) {
  const body = text.replace(/^---\n[\s\S]*?\n---\n/,"");
  const out=[], fence=/^```(python(?:\s+setup)?)\s*\n([\s\S]*?)^```\s*$/gm;
  let last=0, label="", marks=0, taskId="", codeIdx=0, m;
  while ((m=fence.exec(body))!==null) {
    if (m.index>last) {
      const prose=body.slice(last,m.index);
      [...prose.matchAll(/^#{1,6}\s+(.+)$/gm)].forEach(h=>{
        label=h[1].trim();
        const mm=label.match(/\((\d+)\s+marks?\)/i); marks=mm?parseInt(mm[1]):0;
        const tm=label.match(/Task\s+(\w+)/i); taskId=tm?tm[1]:"";
      });
      out.push({type:"markdown",content:prose});
    }
    const tag=m[1].trim(), src=m[2];
    if (tag==="python setup") { out.push({type:"setup",content:src}); }
    else { out.push({type:"code",content:src,label,marks,taskId,
      index:codeIdx++,studentCode:src,outputHTML:"",hasError:false,lastRun:null}); }
    last=m.index+m[0].length;
  }
  if (last<body.length) out.push({type:"markdown",content:body.slice(last)});
  return out;
}

function mdToHtml(md) {
  let h=md;
  h=h.replace(/^---$/gm,"<hr>");
  for(let i=6;i>=1;i--) h=h.replace(new RegExp(`^${"#".repeat(i)}\\s+(.+)$`,"gm"),`<h${i}>$1</h${i}>`);
  h=h.replace(/((?:^\|.+\|\s*\n)+)/gm,block=>{
    const rows=block.trim().split("\n").filter(r=>!/^\|[-| :]+\|/.test(r));
    return "<table>"+rows.map((r,i)=>{
      const tag=i===0?"th":"td";
      return "<tr>"+r.split("|").slice(1,-1).map(c=>`<${tag}>${c.trim()}</${tag}>`).join("")+"</tr>";
    }).join("")+"</table>";
  });
  h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>");
  h=h.replace(/((?:^[-*] .+\n?)+)/gm,b=>"<ul>"+b.trim().split("\n").map(l=>`<li>${l.replace(/^[-*] /,"")}</li>`).join("")+"</ul>");
  h=h.replace(/((?:^\d+\. .+\n?)+)/gm,b=>"<ol>"+b.trim().split("\n").map(l=>`<li>${l.replace(/^\d+\. /,"")}</li>`).join("")+"</ol>");
  h=h.split(/\n{2,}/).map(b=>{b=b.trim();if(!b||/^<[a-zA-Z]/.test(b))return b;return`<p>${b.replace(/\n/g,"<br>")}</p>`;}).join("\n");
  return h;
}

// ── Rendering ──────────────────────────────────────────────────────────────
function renderExam() {
  const main=document.getElementById("main");
  main.innerHTML="";
  cells.forEach((cell,idx)=>{
    if (cell.type==="setup") return;
    if (cell.type==="markdown") {
      const d=document.createElement("div");
      d.className="md"; d.innerHTML=mdToHtml(cell.content);
      main.appendChild(d); return;
    }
    const marks = cell.marks ? ` · ${cell.marks} marks` : "";
    const wrap=document.createElement("div");
    wrap.className="cell"; wrap.id=`cell-${idx}`;
    wrap.innerHTML=`
      <div class="cell-bar">
        <span class="cell-lbl">${esc(cell.label||"Cell "+(cell.index+1))}${marks}</span>
        <span class="cell-stat" id="stat-${idx}"></span>
        <span class="run-hint">Ctrl+Enter to run</span>
        <button class="run-btn" id="run-${idx}" onclick="runCell(${idx})">Run</button>
      </div>
      <div id="cm-${idx}"></div>
      <div class="cell-out" id="out-${idx}"></div>`;
    main.appendChild(wrap);

    // Attach CodeMirror
    const cm=CodeMirror(document.getElementById(`cm-${idx}`),{
      value:cell.content, mode:"python", theme:"dracula",
      lineNumbers:true, indentUnit:4, tabSize:4, indentWithTabs:false,
      lineWrapping:false, viewportMargin:Infinity,
      extraKeys:{
        "Tab": cm=>cm.execCommand("indentMore"),
        "Shift-Tab": cm=>cm.execCommand("indentLess"),
        "Ctrl-Enter": ()=>runCell(idx),
        "Cmd-Enter":  ()=>runCell(idx),
      }
    });
    cm.on("change", ()=>{ cell.studentCode=cm.getValue(); });
    editors[idx]=cm;
  });

  // End-of-exam banner — appended after the last cell
  const banner = document.createElement("div");
  banner.id = "end-banner";
  banner.innerHTML = `
    <div style="border-top:3px solid var(--accent);margin-top:32px;padding:28px 0 8px">
      <h2 style="font-size:1.2rem;color:var(--accent);margin-bottom:16px">
        End of Examination
      </h2>
      <p style="margin-bottom:20px;font-family:var(--sans);font-size:.95rem">
        You have reached the end of the exam. Before you finish, complete
        all three steps below.
      </p>

      <div style="display:flex;flex-direction:column;gap:12px;font-family:var(--sans);font-size:.9rem">

        <div style="background:var(--accent-lt);border:1px solid var(--accent);
                    border-radius:var(--radius);padding:14px 18px;display:flex;gap:14px;align-items:flex-start">
          <span style="font-size:1.3rem;flex-shrink:0">1</span>
          <div>
            <strong>Print a PDF for the assessor</strong><br>
            Click the <strong>Print / PDF</strong> button in the top-right toolbar.
            When the print dialog opens, set the destination to
            <em>Save as PDF</em> and save the file.
            This creates the copy your external assessor will review.
          </div>
        </div>

        <div style="background:var(--accent-lt);border:1px solid var(--accent);
                    border-radius:var(--radius);padding:14px 18px;display:flex;gap:14px;align-items:flex-start">
          <span style="font-size:1.3rem;flex-shrink:0">2</span>
          <div>
            <strong>Save your submission file (.json)</strong><br>
            Click the <strong>Save</strong> button in the top-right toolbar.
            This downloads a <code>.json</code> file containing all your code
            and outputs. Keep this file — you will need it in the next step.
          </div>
        </div>

        <div style="background:var(--accent-lt);border:1px solid var(--accent);
                    border-radius:var(--radius);padding:14px 18px;display:flex;gap:14px;align-items:flex-start">
          <span style="font-size:1.3rem;flex-shrink:0">3</span>
          <div>
            <strong>Upload to Moodle and confirm with your invigilator</strong><br>
            Upload your <code>.json</code> file to the exam submission link on Moodle.
            Once uploaded, raise your hand to confirm submission with your invigilator
            before closing your computer.
          </div>
        </div>

      </div>
    </div>`;
  main.appendChild(banner);
}

// ── Cell execution ─────────────────────────────────────────────────────────
async function runSetupCells() {
  for (let i=0;i<cells.length;i++) {
    if (cells[i].type!=="setup") continue;
    window.examCurrentOutputId="__setup__";
    try { await pyodide.runPythonAsync(cells[i].content); }
    catch(e) {
      const d=document.createElement("div");
      d.className="cell-err"; d.style.margin="14px";
      d.textContent="Setup failed: "+e.message;
      document.getElementById("main").prepend(d);
    }
  }
}

async function runCell(idx) {
  if (isRunning) return;
  isRunning=true;
  const cell=cells[idx];
  const outEl=document.getElementById(`out-${idx}`);
  const btn=document.getElementById(`run-${idx}`);
  const stat=document.getElementById(`stat-${idx}`);
  if (editors[idx]) cell.studentCode=editors[idx].getValue();
  btn.disabled=true; btn.textContent="Running...";
  stat.textContent=""; stat.className="cell-stat";
  outEl.innerHTML="";
  window.examCurrentOutputId=`out-${idx}`;

  await pyodide.runPythonAsync(`
import sys,io as _io
_exam_buf=_io.StringIO()
sys.stdout=_exam_buf
`);
  let hasError=false;
  try { await pyodide.runPythonAsync(cell.studentCode); }
  catch(e) {
    hasError=true;
    const p=document.createElement("pre");
    p.className="cell-err"; p.textContent=e.message;
    outEl.appendChild(p);
  }
  const printed=await pyodide.runPythonAsync(`
sys.stdout=_exam_original_stdout
_cap=_exam_buf.getvalue()
_exam_buf.close()
_cap
`);
  if (printed&&printed.trim()) {
    const p=document.createElement("pre");
    p.className="et-stdout"; p.textContent=printed;
    outEl.appendChild(p);
  }
  cell.hasError=hasError; cell.lastRun=new Date().toISOString();
  cell.outputHTML=outEl.innerHTML;
  stat.textContent=hasError?"Error":"OK";
  stat.className="cell-stat "+(hasError?"err":"ok");
  btn.disabled=false; btn.textContent="Run";
  isRunning=false;
  await autoSave();
}

// ── Saving ─────────────────────────────────────────────────────────────────
function buildJSON() {
  const name=document.getElementById("sname").value||
             document.getElementById("h-student").textContent;
  return {
    student_name:name, exam_title:meta.title||"",
    module:meta.module||"", session:meta.session||"",
    exported_at:new Date().toISOString(),
    cells:cells.filter(c=>c.type==="code").map(c=>({
      task_id:c.taskId||null, task_label:c.label||"",
      marks_possible:c.marks||0, student_code:c.studentCode||"",
      output_html:c.outputHTML||"", has_error:c.hasError||false,
      last_run:c.lastRun||null
    }))
  };
}
async function autoSave() {
  if (!fileHandle) { setSave("unsaved"); return; }
  try {
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(buildJSON(),null,2));
    await w.close(); setSave("saved");
  } catch(e){ setSave("error"); }
}
function saveDownload() {
  const blob=new Blob([JSON.stringify(buildJSON(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`exam_submission_${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url); setSave("saved");
}
function setSave(s) {
  const el=document.getElementById("save-status");
  el.textContent=s==="saved"?"Saved":s==="error"?"Save failed":"";
  el.style.color=s==="saved"?"var(--success)":"var(--error)";
}

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function b64ToBytes(b64){
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
